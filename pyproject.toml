[project]
name = "booking-service"
version = "0.1.0"
description = "Booking service (учебный проект на Django)"
authors = [
    {name = "Gaiu Taras Fedor", email = "gaytaras@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "django (==6.1.1)",
    "django-environ (==0.14.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "ipython (>=9.17.1,<10.0.0)",
    "faker (>=40.43.0,<41.0.0)",
    "django-debug-toolbar (>=8.0.0,<9.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"